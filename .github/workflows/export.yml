# Builds Windows, macOS and Linux from ONE Linux runner (Godot cross-exports with official templates).
# Runs only on version tags (v0.1.0, ...) or manually, to save Actions minutes and artifact storage.
# A pushed v* tag (push event, never a manual run) also publishes the three builds as a GitHub pre-release. A manual run
# (workflow_dispatch) only uploads artifacts and never creates a release.
name: export

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default; only the release job below gets write access.
permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (pinned by SHA)
        with:
          lfs: true             # builds need real assets
          fetch-depth: 0        # the tag check below needs main's history
          persist-credentials: false

      # Releases are cut from main (docs/WORKFLOW.md); a tag on a develop-only commit is a mistake.
      - name: Tag must point at a commit on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # fetch-depth: 0 above already fetched every branch, so origin/main exists without credentials.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Merge develop into main first, then tag main."
            exit 1
          fi

      # The version shown in the builds lives in export_presets.cfg and must match the tag, so a
      # release never ships a build that reports another version. Windows and macOS presets carry
      # a version; the Linux preset has no version field (its archive is named after the tag).
      - name: Preset versions must match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="${GITHUB_REF_NAME#v}"
          expected="${expected%%-*}"      # v0.2.0-rc1 -> 0.2.0
          status=0
          for line in \
            "application/short_version=\"$expected\"" \
            "application/version=\"$expected\"" \
            "application/file_version=\"$expected.0\"" \
            "application/product_version=\"$expected.0\""; do
            if ! grep -qxF "$line" export_presets.cfg; then
              echo "::error::export_presets.cfg is missing '$line' (tag $GITHUB_REF_NAME). Bump the preset versions and retag."
              status=1
            fi
          done
          exit $status

      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3 (pinned by SHA)
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: godot --headless --path . --import
        timeout-minutes: 5

      - name: Run tests before building
        run: godot --headless --path . -s addons/gut/gut_cmdln.gd -gexit

      # Preset names must match export_presets.cfg exactly (case-sensitive).
      - name: Export
        run: |
          mkdir -p build/windows build/macos build/linux
          godot --headless --path . --export-release "Windows Desktop" build/windows/Londinium.exe
          godot --headless --path . --export-release "macOS"           build/macos/Londinium.zip
          godot --headless --path . --export-release "Linux"           build/linux/Londinium.x86_64

      # Boot the real Linux build for a moment. If data/ is missing or invalid in the export, DataLoader
      # diagnostics reach the log as "ERROR: <file>.json: <problem>" (or "cannot open directory").
      # Release templates print no GDScript backtrace, so match the message, not a function name.
      - name: Smoke test the Linux build
        run: |
          chmod +x build/linux/Londinium.x86_64
          ./build/linux/Londinium.x86_64 --headless --quit-after 120 > smoke.log 2>&1
          cat smoke.log
          if grep -E "ERROR:.*(\.json|cannot open directory)" smoke.log; then
            echo "::error::The exported Linux build could not load data/ (see the DataLoader errors above)."
            exit 1
          fi

      # Branch names may contain "/", which cannot go in a file name.
      - name: Package
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          mkdir -p dist/windows dist/macos dist/linux
          zip -j "dist/windows/Londinium-${version}-windows.zip" build/windows/Londinium.exe
          cp build/macos/Londinium.zip "dist/macos/Londinium-${version}-macos.zip"
          tar -czf "dist/linux/Londinium-${version}-linux.tar.gz" -C build/linux Londinium.x86_64

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 (pinned by SHA)
        with: { name: londinium-windows, path: dist/windows, retention-days: 14 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 (pinned by SHA)
        with: { name: londinium-macos, path: dist/macos, retention-days: 14 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 (pinned by SHA)
        with: { name: londinium-linux, path: dist/linux, retention-days: 14 }

  release:
    needs: export
    # A manual run on an existing tag must not publish: only a pushed tag does.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write           # create the release
      actions: read             # download this run's artifacts
    steps:
      - name: Download builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir dist

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          Build jugable del prototipo (hito 1). Sin firmar: cada sistema avisa la primera vez.

          **Windows** — descomprimir y abrir `Londinium.exe`. Si SmartScreen avisa "editor desconocido": Más información → Ejecutar de todas formas.

          **macOS** — descomprimir y mover `Londinium.app` a Aplicaciones. Intentar abrirla una vez (macOS la bloquea). Después: Ajustes del Sistema → Privacidad y seguridad → bajar hasta el aviso sobre Londinium → "Abrir igualmente". Si no aparece, en Terminal:

          ```
          xattr -dr com.apple.quarantine /Applications/Londinium.app
          ```

          **Linux** — `tar -xzf Londinium-*-linux.tar.gz && ./Londinium.x86_64` (si hiciera falta, `chmod +x Londinium.x86_64`).
          EOF
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Londinium $TAG" --notes-file notes.md dist/*/*
