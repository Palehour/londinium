# Corre la suite GUT headless en PRs a develop/main y en pushes a develop/main.
# Linux only: cheapest runner. The repo is private on GitHub Free (2,000 min/month, each job billed apart).
name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  # The slow suite runs in three parts of 10 min each (#287, D-144, which extends D-132). Parts 1 and 2 run only
  # the tests listed here (the longest ones, measured in CI), and part 1 also the balance report; part 3 runs every
  # other test of tests/slow/, so a new slow test lands there without touching this file. A name that matches no test
  # fails the run (tools/gut_shard.gd).
  SLOW_PART_1_TESTS: >-
    test_net_worth_levers_one_at_a_time
  SLOW_PART_2_TESTS: >-
    test_big_tight_r06_smart_keeps_every_city_safe_and_buys_at_most_a_minute_and_a_half_later,
    test_big_tight_r06_financing_across_twenty_seeds,
    test_both_chains_keep_bread_covered_and_the_mill_supplied_across_twenty_seeds,
    test_bread_against_beer_and_the_beer_crisis_play_their_file_seed

jobs:
  # Unit suite: every test_*.gd outside tests/slow/ (#268, D-132). Required check "tests (unit)".
  unit:
    name: tests (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (pinned by SHA)
        with:
          lfs: false            # tests never need art/audio; saves LFS bandwidth
          persist-credentials: false
          fetch-depth: 2        # on a PR, HEAD is the merge commit and HEAD^1 the base tip (docs-only check)

      - name: Set up Godot and check the project
        id: setup
        uses: ./.github/actions/setup-godot-ci
        with:
          godot-version: ${{ env.GODOT_VERSION }}

      # -gconfig= skips .gutconfig.json, whose dirs would run the whole suite. GUT cannot exclude a folder, so the
      # unit suite is the list of every test_*.gd outside tests/slow/.
      - name: Run unit tests (all but tests/slow/)
        if: steps.setup.outputs.docs_only != 'true'
        run: |
          files="$(find tests -name 'test_*.gd' -not -path 'tests/slow/*' | sort | sed 's|^|res://|' | paste -sd, -)"
          godot --headless --path . -s addons/gut/gut_cmdln.gd -gexit -gconfig= -gtest="$files" -gjunit_xml_file=res://gut_results.xml

      # Every test file that reads docs/ (today test_population_peak_decay and test_city_start_and_defeat), so a
      # docs edit cannot break them unseen. -gconfig= skips .gutconfig.json, which would run the whole suite.
      - name: Run tests that read docs/ (docs-only PR)
        if: steps.setup.outputs.docs_only == 'true'
        run: |
          files="$(grep -rlE --include='test_*.gd' 'res://docs/' tests | sed 's|^|res://|' | paste -sd, -)"
          if [ -z "$files" ]; then
            echo "No test reads docs/; nothing to run."
            exit 0
          fi
          echo "Running: $files"
          godot --headless --path . -s addons/gut/gut_cmdln.gd -gexit -gconfig= -gtest="$files" -gjunit_xml_file=res://gut_results.xml
        timeout-minutes: 5

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (pinned by SHA)
        with:
          name: gut-results-unit
          path: gut_results.xml
          retention-days: 7
          if-no-files-found: ignore

  # tests/slow/ (the scripted scenario games) in parallel parts, each with the 10-min limit of D-132 (#287, D-144).
  slow-part:
    name: tests (slow ${{ matrix.part }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.setup.outputs.docs_only }}
    strategy:
      fail-fast: false      # a failure in one part must not cancel the others' results
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (pinned by SHA)
        with:
          lfs: false
          persist-credentials: false
          fetch-depth: 2

      - name: Set up Godot and check the project
        id: setup
        uses: ./.github/actions/setup-godot-ci
        with:
          godot-version: ${{ env.GODOT_VERSION }}

      # tools/gut_shard.gd (pre-run hook) keeps this part's tests: parts 1 and 2 "only" their list, part 3
      # "except" both lists. -gconfig= skips .gutconfig.json, whose dirs would run the whole suite.
      - name: Run slow tests (part ${{ matrix.part }} of tests/slow/)
        if: steps.setup.outputs.docs_only != 'true'
        env:
          GUT_SHARD_MODE: ${{ matrix.part == 3 && 'except' || 'only' }}
          GUT_SHARD_TESTS: >-
            ${{ matrix.part == 1 && env.SLOW_PART_1_TESTS
            || matrix.part == 2 && env.SLOW_PART_2_TESTS
            || format('{0},{1}', env.SLOW_PART_1_TESTS, env.SLOW_PART_2_TESTS) }}
        run: |
          godot --headless --path . -s addons/gut/gut_cmdln.gd -gexit -gconfig= -gdir=res://tests/slow -ginclude_subdirs -gprefix=test_ -gpre_run_script=res://tools/gut_shard.gd -gjunit_xml_file=res://gut_results.xml
          # An aborted hook (a listed name that matches no test) exits 0 without a report.
          if [ ! -f gut_results.xml ]; then
            echo "::error::GUT wrote no report; see the [GUT ERROR] lines above"
            exit 1
          fi

      # Per-minute CSV of the scripted scenarios (tests/scenarios/) so Mason can tune data/ without Godot.
      # It never fails on values; the scenario tests do that. It runs in part 1, the one with the shortest tests in CI.
      - name: Balance report
        if: always() && matrix.part == 1 && steps.setup.outputs.docs_only != 'true'
        run: godot --headless --path . -s tools/balance_report.gd -- --out build/balance
        timeout-minutes: 3

      - name: Balance summary
        if: always() && matrix.part == 1 && steps.setup.outputs.docs_only != 'true'
        run: |
          {
            echo "### Balance report (minute 15 of each scenario)"
            echo
            echo "| scenario | population | money (pence) | bread coverage | satisfaction | defeat |"
            echo "|---|---|---|---|---|---|"
            awk -F, 'NR > 1 && $2 == 15 { printf "| %s | %s | %s | %s | %s | %s |\n", $1, $4, $5, $6, $7, $NF }' build/balance/balance_all.csv
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload balance report
        if: always() && matrix.part == 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (pinned by SHA)
        with:
          name: balance-report
          path: build/balance
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (pinned by SHA)
        with:
          name: gut-results-slow-${{ matrix.part }}
          path: gut_results.xml
          retention-days: 7
          if-no-files-found: ignore

  # Required check "tests (slow)" (branch protection did not change): green only when every part is green and the
  # parts together ran each test of tests/slow/ exactly once. No Godot here.
  slow:
    name: tests (slow)
    if: always()
    needs: slow-part
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part passed
        run: |
          echo "slow parts: ${{ needs.slow-part.result }}"
          [ "${{ needs.slow-part.result }}" = "success" ]

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (pinned by SHA)
        if: needs.slow-part.outputs.docs_only != 'true'
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: tests/slow

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (pinned by SHA)
        if: needs.slow-part.outputs.docs_only != 'true'
        with:
          pattern: gut-results-slow-*
          path: parts

      # GUT counts every func test_* of each collected script; the parts' junit totals must add up to that.
      - name: The parts ran every slow test once
        if: needs.slow-part.outputs.docs_only != 'true'
        run: |
          expected="$(find tests/slow -name 'test_*.gd' -exec grep -hE '^func test_' {} + | wc -l)"
          ran=0
          for part in 1 2 3; do
            report="parts/gut-results-slow-$part/gut_results.xml"
            if [ ! -f "$report" ]; then
              echo "::error::part $part wrote no test report"
              exit 1
            fi
            count="$(grep -oE '<testsuites [^>]*tests="[0-9]+"' "$report" | grep -oE '[0-9]+"$' | tr -d '"')"
            echo "part $part: $count tests"
            ran=$((ran + count))
          done
          echo "parts: $ran tests, tests/slow/: $expected tests"
          if [ "$ran" -ne "$expected" ]; then
            echo "::error::the slow parts ran $ran tests but tests/slow/ has $expected"
            exit 1
          fi
