# Corre la suite GUT headless en PRs a develop/main y en pushes a develop/main.
# Linux only: cheapest runner (free for public repos; 2,000 min/month if the repo becomes private).
name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  # Two suites in parallel (#268, D-132): tests/slow/ (the scripted scenario games, ~45 % of the GUT time) and
  # everything else. Together they run every test_*.gd of tests/, the same scripts as tools/run_tests. Both checks
  # ("tests (unit)" and "tests (slow)") are required on develop.
  tests:
    name: tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false      # a failure in one suite must not cancel the other's result
      matrix:
        suite: [unit, slow]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (pinned by SHA)
        with:
          lfs: false            # tests never need art/audio; saves LFS bandwidth
          persist-credentials: false
          fetch-depth: 2        # on a PR, HEAD is the merge commit and HEAD^1 the base tip (docs-only check below)

      # A PR that only touches docs/ skips the long GUT run and the balance report, but the job still runs (and
      # still reports the required check) with the tests that read docs/. Cristian's decision, 2026-10-24 (#226).
      - name: Detect docs-only PR
        id: scope
        run: |
          docs_only=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed="$(git diff --name-only HEAD^1 HEAD)"
            echo "$changed"
            if [ -n "$changed" ] && ! grep -qv '^docs/' <<< "$changed"; then
              docs_only=true
            fi
          fi
          echo "docs_only=$docs_only" | tee -a "$GITHUB_OUTPUT"

      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3 (pinned by SHA)
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false     # GDScript only
          include-templates: false

      # Renames do not need Godot. Parse runs after import so class_name is already cached.
      # Cristian approved adding both steps here on 2026-10-17 (issue #114).
      - name: Check Godot 3 API renames
        run: bash tools/check_gdscript.sh --renames-only

      - name: Import project (builds .godot cache / class_name list)
        run: godot --headless --path . --import
        timeout-minutes: 5

      - name: Check GDScript parse
        run: bash tools/check_gdscript.sh --parse-only
        timeout-minutes: 5

      # -gconfig= skips .gutconfig.json, whose dirs would run the whole suite. GUT cannot exclude a folder, so the
      # unit suite is the list of every test_*.gd outside tests/slow/.
      - name: Run unit tests (all but tests/slow/)
        if: matrix.suite == 'unit' && steps.scope.outputs.docs_only != 'true'
        run: |
          files="$(find tests -name 'test_*.gd' -not -path 'tests/slow/*' | sort | sed 's|^|res://|' | paste -sd, -)"
          godot --headless --path . -s addons/gut/gut_cmdln.gd -gexit -gconfig= -gtest="$files" -gjunit_xml_file=res://gut_results.xml

      - name: Run slow tests (tests/slow/)
        if: matrix.suite == 'slow' && steps.scope.outputs.docs_only != 'true'
        run: |
          godot --headless --path . -s addons/gut/gut_cmdln.gd -gexit -gconfig= -gdir=res://tests/slow -ginclude_subdirs -gprefix=test_ -gjunit_xml_file=res://gut_results.xml

      # Every test file that reads docs/ (today test_population_peak_decay and test_city_start_and_defeat), so a
      # docs edit cannot break them unseen. -gconfig= skips .gutconfig.json, which would run the whole suite.
      - name: Run tests that read docs/ (docs-only PR)
        if: matrix.suite == 'unit' && steps.scope.outputs.docs_only == 'true'
        run: |
          files="$(grep -rlE --include='test_*.gd' 'res://docs/' tests | sed 's|^|res://|' | paste -sd, -)"
          if [ -z "$files" ]; then
            echo "No test reads docs/; nothing to run."
            exit 0
          fi
          echo "Running: $files"
          godot --headless --path . -s addons/gut/gut_cmdln.gd -gexit -gconfig=             -gtest="$files" -gjunit_xml_file=res://gut_results.xml
        timeout-minutes: 5

      # Per-minute CSV of the scripted scenarios (tests/scenarios/) so Mason can tune data/ without Godot.
      # It never fails on values; the scenario tests above do that.
      - name: Balance report
        if: always() && matrix.suite == 'slow' && steps.scope.outputs.docs_only != 'true'
        run: godot --headless --path . -s tools/balance_report.gd -- --out build/balance
        timeout-minutes: 3

      - name: Balance summary
        if: always() && matrix.suite == 'slow' && steps.scope.outputs.docs_only != 'true'
        run: |
          {
            echo "### Balance report (minute 15 of each scenario)"
            echo
            echo "| scenario | population | money (pence) | bread coverage | satisfaction | defeat |"
            echo "|---|---|---|---|---|---|"
            awk -F, 'NR > 1 && $2 == 15 { printf "| %s | %s | %s | %s | %s | %s |\n", $1, $4, $5, $6, $7, $NF }' build/balance/balance_all.csv
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload balance report
        if: always() && matrix.suite == 'slow'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (pinned by SHA)
        with:
          name: balance-report
          path: build/balance
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (pinned by SHA)
        with:
          name: gut-results-${{ matrix.suite }}
          path: gut_results.xml
          retention-days: 7
          if-no-files-found: ignore
