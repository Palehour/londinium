# Corre la suite GUT headless en PRs a develop/main y en pushes a develop/main.
# Linux only: cheapest runner (free for public repos; 2,000 min/month if the repo becomes private).
name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  tests:
    name: tests (headless GUT)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false            # tests never need art/audio; saves LFS bandwidth
          persist-credentials: false

      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3 (pinned by SHA)
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false     # GDScript only
          include-templates: false

      - name: Import project (builds .godot cache / class_name list)
        run: godot --headless --path . --import
        timeout-minutes: 5

      - name: Run tests
        run: godot --headless --path . -s addons/gut/gut_cmdln.gd -gexit
        timeout-minutes: 8

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gut-results
          path: gut_results.xml
          retention-days: 7
          if-no-files-found: ignore
